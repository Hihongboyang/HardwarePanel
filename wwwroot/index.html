<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HardwarePanel</title>
<style>
  /* 全 ES5 兼容:无 CSS 变量/inset/flex-gap;clamp() 前写像素回退;grid 有 flex 回退 */
  /* EVA/NERV 皮肤:真黑底;荧光色各司其职——红 #ff3030/#cc2020(标识/警报)、绿 #50ff50(正常)、钢灰(辅助文字);全直角;CRT 扫描线 */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; display: flex; flex-direction: column;
         font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
         background: #000; color: #e8ece9;
         -webkit-user-select: none; user-select: none; }
  .mono, .clock, .hv, .rv, .ptag, .n-item, .en, .count { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

  /* CRT 氛围:细扫描线 + 暗角 + 一条慢速红色扫描带(唯一常驻循环动效) */
  body::after { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9998;
                pointer-events: none;
                background: repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0, rgba(255,255,255,.015) 1px, transparent 1px, transparent 3px); }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9997;
                 pointer-events: none;
                 background: radial-gradient(ellipse 75% 75% at center, transparent 58%, rgba(0,0,0,.4) 100%); }
  .scanband { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 9996; pointer-events: none;
              background: linear-gradient(90deg, transparent 0%, rgba(255,48,48,.08) 25%, rgba(255,48,48,.2) 50%, rgba(255,48,48,.08) 75%, transparent 100%);
              -webkit-animation: scan-sweep 9s linear infinite; animation: scan-sweep 9s linear infinite; }
  @-webkit-keyframes scan-sweep { from { -webkit-transform: translateY(0); } to { -webkit-transform: translateY(100vh); } }
  @keyframes scan-sweep { from { transform: translateY(0); } to { transform: translateY(100vh); } }
  /* 背景:原版 nerv-ui(React 构建)以同源 iframe 承载——连接器场 100% 原样运行;
     整体透明度 0.6:橙场压暗融入黑底,信息面板可读性优先 */
  .bgframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
             z-index: 0; border: 0; pointer-events: none; opacity: .6; }
  header, #panels { position: relative; z-index: 1; }

  header { flex: none; display: flex; align-items: center; height: 46px; padding: 0 14px;
           background: rgba(5,5,5,.6); border-bottom: 1px solid #8c1616; }
  .brand { display: flex; align-items: center; min-width: 0; white-space: nowrap; }
  .brand .mark { flex: none; width: 18px; height: 20px; margin-right: 9px; color: #ff3030; }
  .brand .bt { display: block; }
  .brand .zh { display: block; font-size: 14px; font-weight: 600; color: #e8ece9; letter-spacing: .06em; }
  .brand .en { display: block; margin-top: 1px; font-size: 8px; line-height: 1; color: #cc2020; letter-spacing: .3em; }
  .plug { flex: none; width: 96px; height: 22px; margin-left: auto;
          color: rgba(255,80,80,.5); }
  @media (max-width: 620px) { .plug { display: none; } .clock { margin-left: auto; } }
  .clock { margin-left: 10px; display: flex; align-items: center; padding: 3px 10px; font-size: 14px;
           color: #ff5050; background: rgba(255,48,48,.05); border: 1px solid rgba(204,32,32,.5);
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
         background: #50ff50; box-shadow: 0 0 5px rgba(80,255,80,.55);
         margin-right: 9px; vertical-align: 1px; }
  .dot.off { background: #555b55; box-shadow: none; }
  .icon-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px;
              margin-left: 6px; color: #8a8e8a; background: none; border: 1px solid transparent;
              cursor: pointer; transition: color .15s, background-color .15s, border-color .15s; }
  .icon-btn:hover { color: #ff5050; background: #101013; border-color: rgba(204,32,32,.35); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* 面板网格:固定 2×2(空面板自动隐藏),竖屏 1 列 */
  #panels { flex: 1; min-height: 0; width: 100%; max-width: 1280px; margin: 0 auto;
            padding: 10px; display: grid; gap: 10px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: minmax(0, 1fr); }
  @media (max-width: 560px) {
    #panels { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
    .panel { min-height: 132px; }
  }
  #panels .empty { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: #6a6e6a; }
  #panels .empty a { color: #ff5050; }

  .panel { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
           overflow: hidden; background: rgba(12,12,14,.88); border: 1px solid rgba(190,35,35,.38);
           padding: 12px 14px; border-radius: 0; }
  /* EVA 取景框角标 */
  .panel .corner { position: absolute; width: 9px; height: 9px; pointer-events: none; color: #ff3030; }
  .panel .corner.tl { top: -1px; left: -1px; border-top: 2px solid #ff3030; border-left: 2px solid #ff3030; }
  .panel .corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid #ff3030; border-right: 2px solid #ff3030; }

  .p-head { flex: none; display: flex; align-items: center; padding-bottom: 7px;
            border-bottom: 1px solid rgba(190,35,35,.3); }
  .p-head .hexnode { flex: none; width: 13px; height: 15px; margin-right: 8px; color: #ff3030; }
  .p-head .hexnode .hxf { fill: rgba(255,48,48,.14); stroke: none; }
  .p-head .nm { font-size: 12px; font-weight: 600; color: #d8d8d0; letter-spacing: .05em;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-head .ptag { flex: none; margin-left: 8px; font-size: 8px; color: #cc2020; letter-spacing: .18em; }
  .p-head .n-item { margin-left: auto; padding-left: 12px; font-size: 10px; color: #6a6e6a;
                    font-variant-numeric: tabular-nums; }
  .p-body { flex: 1; min-height: 0; display: flex; margin-top: 8px; }

  /* 左:该面板的关键指标(唯一的曲线) */
  .hero { display: flex; flex-direction: column; width: 42%; min-width: 0; }
  .hero .hl { font-size: 11px; color: #8a8e8a; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  .hero .hv { margin-top: 2px; font-size: 22px; font-size: clamp(18px, 3.8vmin, 42px);
              line-height: 1.05; color: #eef2ee; font-variant-numeric: tabular-nums;
              text-shadow: 0 0 12px rgba(235,255,235,.13);
              white-space: nowrap; transition: color .3s, text-shadow .3s; }
  .hero .hu { font-size: 11px; font-size: clamp(10px, 1.3vmin, 13px); color: #6a6e6a;
              margin-left: 4px; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .hero .chart { flex: 1; min-height: 0; width: 100%; margin-top: 6px; }
  .hero .chart .line { fill: none; stroke: #ff3030; stroke-width: 1.5;
                       vector-effect: non-scaling-stroke; opacity: .9; transition: stroke .3s; }
  .hero .chart .fillp { fill: rgba(255,48,48,.13); stroke: none; transition: fill .3s; }
  .hero .chart .thr { stroke: rgba(255,80,80,.55); stroke-width: 1;
                      stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }

  /* 右:其余指标,统一单行(标签左/数值右);% 行下挂细条;>12 条目时双列 */
  .rows { flex: 1; min-width: 0; display: flex; flex-direction: column;
          justify-content: space-between; margin-left: 16px;
          overflow-y: auto; overflow-x: hidden; }
  .srow2 { flex: 1; min-height: 0; display: flex; flex-wrap: wrap;
           align-items: baseline; padding: 2px 0; }
  .srow2 + .srow2 { border-top: 1px solid rgba(255,255,255,.05); }
  .srow2 .rl { flex: 1; min-width: 40%; margin: 0 8px 0 0; font-size: 12px; color: #8a8e8a;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow2 .rvwrap { flex: none; white-space: nowrap; }
  .srow2 .rv { font-size: 14px; font-size: clamp(13px, 2vmin, 20px); color: #e8ece9;
               font-variant-numeric: tabular-nums; transition: color .3s; }
  .srow2 .ru { font-size: 10px; color: #6a6e6a; margin-left: 4px; }
  .srow2 .bar { flex-basis: 100%; height: 2px; margin-top: 3px; background: rgba(255,255,255,.07);
                position: relative; overflow: hidden; }
  .srow2 .bar b { display: block; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                  background: #c22222;
                  -webkit-transform-origin: 0 50%; transform-origin: 0 50%;
                  -webkit-transform: scaleX(.5); transform: scaleX(.5);
                  -webkit-transition: -webkit-transform .3s; transition: transform .3s; }
  /* 双列模式(宽面板、条目很多时) */
  .rows.multi { display: block; -webkit-column-count: 2; column-count: 2;
                -webkit-column-gap: 16px; column-gap: 16px; }
  .rows.multi .srow2 { -webkit-column-break-inside: avoid; break-inside: avoid; }

  /* 线程负载微条(transform 缩放,不动画布局属性) */
  .cores-cap { flex: none; font-size: 11px; color: #6a6e6a; margin-bottom: 4px; }
  .cores { flex: none; display: flex; height: 22px; margin-bottom: 8px; }
  .cores i { display: block; position: relative; flex: 1; min-width: 0; height: 100%;
             margin-right: 3px; background: rgba(255,255,255,.06); }
  .cores i:last-child { margin-right: 0; }
  .cores i b { display: block; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
               background: #c22222;
               -webkit-transform-origin: 50% 100%; transform-origin: 50% 100%;
               -webkit-transform: scaleY(.4); transform: scaleY(.4);
               -webkit-transition: -webkit-transform .3s; transition: transform .3s; }

  /* 阈值热区:进入阈值九成区间琥珀预警,越线红 + EMERGENCY(数值与曲线同步) */
  .hero.warm .hv { color: #ffb020; }
  .hero.hot .hv { color: #ff5050; }
  .hero.warm .chart .line { stroke: #ffb020; }
  .hero.warm .chart .fillp { fill: rgba(255,176,32,.14); }
  .hero.hot .chart .line { stroke: #ff3030; opacity: 1; }
  .hero.hot .chart .fillp { fill: rgba(255,48,48,.18); }
  .srow2.warm .rv { color: #ffb020; }
  .srow2.warm .bar b { background: #b37614; }
  .srow2.hot .rv { color: #ff5050; }
  .srow2.hot .bar b { background: #ff3030; }
  .panel.hot { border-color: #ff3030;
               -webkit-animation: panel-alert 1s steps(2, end) infinite; animation: panel-alert 1s steps(2, end) infinite; }
  .panel.hot .hexnode .hxf { fill: rgba(255,48,48,.6); }
  .panel.hot .p-head .n-item::after { content: "EMERGENCY"; margin-left: 10px; color: #ff3030;
               font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
               font-size: 9px; letter-spacing: .14em;
               -webkit-animation: emergency-blink .8s steps(2, end) infinite; animation: emergency-blink .8s steps(2, end) infinite; }
  @-webkit-keyframes emergency-blink { 50% { opacity: .15; } }
  @keyframes emergency-blink { 50% { opacity: .15; } }
  @-webkit-keyframes panel-alert { 50% { border-color: #5a0f0f; } }
  @keyframes panel-alert { 50% { border-color: #5a0f0f; } }

  /* 旧 WebView 无 CSS Grid 时 flex 回退:面板照常铺排,允许滚动 */
  .no-grid #panels { display: flex; flex-wrap: wrap; align-content: flex-start; overflow-y: auto; }
  .no-grid .panel { flex: 1 1 320px; min-height: 140px; margin: 0 10px 10px 0; }
</style>
</head>
<body>
<div class="scanband"></div>
<iframe class="bgframe" src="/nerv-ui/" tabindex="-1" scrolling="no" frameborder="0" aria-hidden="true" title="nerv-ui"></iframe>
<header>
  <span class="brand">
    <svg class="mark" viewBox="0 0 20 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 1 19 6.5v9L10 21 1 15.5v-9z"/><path d="M10 5 15.8 8.35v6.3L10 18 4.2 14.65v-6.3z" fill="rgba(255,48,48,.4)" stroke="none"/></svg>
    <span class="bt"><span class="zh">硬件监控</span><span class="en">HARDWARE PANEL</span></span>
  </span>
  <svg class="plug" viewBox="0 0 200 40" aria-hidden="true">
    <path id="plugL" d="M 4 20 H 58 C 68 -12 68 52 78 20 H 86" stroke="currentColor" stroke-width="3" fill="none"/>
    <path id="plugR" d="M 196 20 H 142 C 132 -12 132 52 122 20 H 114" stroke="currentColor" stroke-width="3" fill="none"/>
    <rect id="plugCL" x="88" y="13" width="12" height="14" rx="2" fill="#cc2020" transform="translate(-28,0)"/>
    <rect id="plugCR" x="100" y="13" width="12" height="14" rx="2" fill="#cc2020" transform="translate(28,0)"/>
    <animate id="aLout" xlink:href="#plugL" href="#plugL" attributeName="d"
             from="M 4 20 H 86" to="M 4 20 H 58 C 68 -12 68 52 78 20 H 86" dur="0.25s" begin="indefinite" fill="freeze"/>
    <animate id="aLin" xlink:href="#plugL" href="#plugL" attributeName="d"
             from="M 4 20 H 58 C 68 -12 68 52 78 20 H 86" to="M 4 20 H 86" dur="0.25s" begin="indefinite" fill="freeze"/>
    <animate id="aRout" xlink:href="#plugR" href="#plugR" attributeName="d"
             from="M 196 20 H 114" to="M 196 20 H 142 C 132 -12 132 52 122 20 H 114" dur="0.25s" begin="indefinite" fill="freeze"/>
    <animate id="aRin" xlink:href="#plugR" href="#plugR" attributeName="d"
             from="M 196 20 H 142 C 132 -12 132 52 122 20 H 114" to="M 196 20 H 114" dur="0.25s" begin="indefinite" fill="freeze"/>
    <animateTransform id="aTLout" xlink:href="#plugCL" href="#plugCL" attributeName="transform" type="translate"
             from="0 0" to="-28 0" dur="0.25s" begin="indefinite" fill="freeze"/>
    <animateTransform id="aTLin" xlink:href="#plugCL" href="#plugCL" attributeName="transform" type="translate"
             from="-28 0" to="0 0" dur="0.25s" begin="indefinite" fill="freeze"/>
    <animateTransform id="aTRout" xlink:href="#plugCR" href="#plugCR" attributeName="transform" type="translate"
             from="0 0" to="28 0" dur="0.25s" begin="indefinite" fill="freeze"/>
    <animateTransform id="aTRin" xlink:href="#plugCR" href="#plugCR" attributeName="transform" type="translate"
             from="28 0" to="0 0" dur="0.25s" begin="indefinite" fill="freeze"/>
  </svg>
  <span class="clock"><span class="dot" id="live"></span><span id="clock">--:--:--</span></span>
  <a class="icon-btn" id="photos" href="/photos.html" title="图片轮播">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
  </a>
  <a class="icon-btn" id="gear" href="/settings.html" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
  </a>
</header>
<div id="panels"><div class="empty" id="boot">连接中…</div></div>
<script src="/lang.js"></script>
<script src="/notify.js"></script>
<script>
// 全 ES5:兼容安卓 5 旧 WebView(无 fetch/箭头/模板串/let/??/?./Map/Set/closest)。
// 面板式信息屏:按硬件分组固定 4 面板;hero=面板唯一曲线;密度阶梯;阈值热区(cfg.alarms)。
// 容错原则:任何一帧、任何一项出错只影响该项显示「—」,不影响其余硬件继续渲染。

var HIST_LEN = 300;
var cfg = null;        // /api/config:visible + alarms
var booted = false;
var cells = {};        // key -> 单元引用与元数据
var hist = {};         // key -> number[](hero 曲线)
var coreRefs = [];     // 每面板线程条引用

/* ---------- 中文名 / 面板归属:共享 lang.js;面板优先用后端目录 /api/hwinfo ---------- */
var hwinfo = null;      // {panels:[...], keys:{key:{device,hwType,panel}}}
/* 面板头:统一六边形状态蜂巢(签名元素,常态红描边,越限时内芯填充)
   + 中文名 + 英文 mono 小标;旧硬件图标由双语标签取代 */
var HEXNODE = '<svg class="hexnode" viewBox="0 0 20 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 1 19 6.5v9L10 21 1 15.5v-9z"/><path class="hxf" d="M10 5 15.8 8.35v6.3L10 18 4.2 14.65v-6.3z"/></svg>';
var PANEL_DEFS = [
  { name: '处理器', tag: 'CPU' },
  { name: '显卡', tag: 'GPU' },
  { name: '内存 · 主板', tag: 'MEM / MB' },
  { name: '存储 · 系统', tag: 'STO / SYS' }
];

/* 面板归属:后端目录(HardwareType 权威判定)优先;旧 exe 无目录时回退名字正则 */
function panelOfKey(key, hw, raw) {
  var e = (hwinfo && hwinfo.keys) ? hwinfo.keys[key] : null;
  if (e && typeof e.panel === 'number') return e.panel;
  return (raw === 'Uptime') ? 0 : panelOf(hw); // 回退:运行时间仍钉在处理器面板
}

/* ---------- 告警规则匹配(与后端 AlarmEngine 同语义) ---------- */
function thrOf(raw, type) {
  if (!cfg || !cfg.alarms) return 0;
  var ls = String(raw).toLowerCase(), i;
  for (i = 0; i < cfg.alarms.length; i++) {
    var a = cfg.alarms[i];
    if (!a.match || ls.indexOf(String(a.match).toLowerCase()) === -1) continue;
    if (a.type && a.type !== type) continue;
    return a.value;
  }
  return 0;
}

/* ---------- 数值格式 ---------- */
function p2(n) { return (n < 10 ? '0' : '') + n; }
function fmt(v, unit, raw) {
  if (v === null || v === undefined) return '—';
  if (raw === 'Uptime') {
    var s = Math.floor(v), d = Math.floor(s / 86400); s -= d * 86400;
    return d + '天' + p2(Math.floor(s / 3600)) + ':' + p2(Math.floor((s % 3600) / 60)) + ':' + p2(s % 60);
  }
  var x;
  if (unit === 'V') x = v.toFixed(2);
  else if (unit === 'W' || unit === 'GB') x = v.toFixed(1);
  else if (unit === 'MB/s') x = v < 10 ? v.toFixed(2) : v.toFixed(1);
  else x = String(Math.round(v));
  if (Math.abs(v) >= 10000) x = Number(x).toLocaleString();
  return x;
}

/* ---------- 曲线几何(viewBox 100×16) ---------- */
function points(h, thr) {
  var min = Infinity, max = -Infinity, i;
  for (i = 0; i < h.length; i++) { if (h[i] < min) min = h[i]; if (h[i] > max) max = h[i]; }
  if (thr) {
    // 有阈值:0 起标,曲线高度 = 占阈值比例,虚线位置即阈值 —— 一眼读出余量
    max = Math.max(max, thr);
    min = 0;
  } else if (min === max) {
    min = max - 1; // 无阈值且为平线:避免 0 跨度
  }
  var span = (max - min) || 1, out = [], thrY = null;
  for (i = 0; i < h.length; i++)
    out.push((i / (h.length - 1) * 100).toFixed(1) + ',' + (15 - (h[i] - min) / span * 13).toFixed(1));
  if (thr && thr <= max && thr >= min) thrY = (15 - (thr - min) / span * 13).toFixed(1);
  return { line: out.join(' '), thrY: thrY };
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

var panelsEl;

/* ---------- 全量帧:按 cfg.visible 顺序建面板(逐面板 createElement,引用即时绑定) ---------- */
function fullRender(rows) {
  var byKey = {}, i, r;
  for (i = 0; i < rows.length; i++) { r = rows[i]; byKey[r.hardware + '|' + r.sensor + '|' + r.type] = r; }

  var sel = [[], [], [], []];
  var visible = (cfg && cfg.visible) ? cfg.visible : [];
  for (i = 0; i < visible.length; i++) {
    var key = visible[i], row = byKey[key];
    // 全量帧里没有的键(传感器消失/数据源被过滤/配置失效):不建占位单元,
    // 否则 hero 可能选中死键永远显示「—」;设置页「已失效的配置项」卡片会提示清理
    if (!row) continue;
    var raw = row.sensor;
    var pi = panelOfKey(key, row.hardware, raw); // 后端目录优先,回退正则
    sel[pi].push({ key: key, raw: raw, type: row.type,
                   unit: row.unit, history: row.history });
  }

  cells = {}; hist = {}; coreRefs = [];
  panelsEl.innerHTML = '';
  var used = 0;

  for (i = 0; i < 4; i++) {
    var items = sel[i];
    if (!items.length) continue;

    // 线程负载汇成微条;运行时间排到面板末尾
    var coreCount = 0, rest = [], tail = [], k;
    for (k = 0; k < items.length; k++) {
      var it = items[k];
      var isCore = it.type === 'Load' &&
        (/^CPU Core #\d+$/.test(it.raw) || /^Core #\d+$/.test(it.raw));
      if (isCore) coreCount++;
      else if (it.raw === 'Uptime') tail.push(it);
      else rest.push(it);
    }
    rest = rest.concat(tail);

    // hero:优先带告警阈值的指标(热区可见),否则第一个温度,否则第一个负载
    var hero = null;
    for (k = 0; k < rest.length; k++) if (thrOf(rest[k].raw, rest[k].type)) { hero = rest[k]; break; }
    if (!hero) for (k = 0; k < rest.length; k++) if (rest[k].type === 'Temperature') { hero = rest[k]; break; }
    if (!hero) for (k = 0; k < rest.length; k++) if (rest[k].type === 'Load') { hero = rest[k]; break; }
    var rowItems = [];
    for (k = 0; k < rest.length; k++) if (rest[k] !== hero) rowItems.push(rest[k]);
    if (!hero && rowItems.length) hero = rowItems.shift();
    if (!hero) continue;
    used++;

    var heroThr = thrOf(hero.raw, hero.type);
    var heroSpark = (hero.type !== 'Data' && hero.type !== 'Level');
    var rowsCls = rowItems.length > 12 ? 'rows multi' : 'rows';

    var el = document.createElement('div');
    el.className = 'panel';
    var html = '<div class="corner tl"></div><div class="corner br"></div>' +
      '<div class="p-head">' + HEXNODE + '<span class="nm">' + esc(PANEL_DEFS[i].name) +
      '</span><span class="ptag">' + PANEL_DEFS[i].tag + '</span><span class="n-item">' +
      (rowItems.length + coreCount) + ' 项</span></div>' +
      '<div class="p-body"><div class="hero">' +
      '<div class="hl">' + esc(cnOf(hero.raw, hero.type)) + '</div>' +
      '<div class="hvwrap"><span class="hv">—</span><span class="hu">' + esc(hero.raw === 'Uptime' ? '' : hero.unit) + '</span></div>' +
      (heroSpark ? '<svg class="chart" viewBox="0 0 100 16" preserveAspectRatio="none">' +
        (heroThr ? '<line class="thr" x1="0" x2="100" y1="0" y2="0"/>' : '') +
        '<polygon class="fillp" points=""/><polyline class="line" points=""/></svg>' : '') +
      '</div><div class="' + rowsCls + '">';
    if (coreCount) {
      html += '<div class="cores-cap">线程负载 ×' + coreCount + '</div><div class="cores">';
      for (var c = 0; c < coreCount; c++) html += '<i><b></b></i>';
      html += '</div>';
    }
    for (var q = 0; q < rowItems.length; q++) {
      var rw = rowItems[q];
      html += '<div class="srow2">' +
        '<div class="rl">' + esc(cnOf(rw.raw, rw.type)) + '</div>' +
        '<div class="rvwrap"><span class="rv">—</span><span class="ru">' + esc(rw.raw === 'Uptime' ? '' : rw.unit) + '</span></div>' +
        (rw.type === 'Load' ? '<div class="bar"><b></b></div>' : '') + '</div>';
    }
    html += '</div></div>';
    el.innerHTML = html;
    panelsEl.appendChild(el);

    // hero 引用(先取 .hero 容器,再在其内部查询,避免面板头角标占位)
    var heroEl = el.getElementsByTagName('div')[4]; // [0/1]=取景框角标 [2]=p-head [3]=p-body [4]=hero
    cells[hero.key] = {
      hero: true, panel: el, block: heroEl,
      v: heroEl.getElementsByTagName('span')[0], unit: hero.unit,
      raw: hero.raw, type: hero.type, thr: heroThr,
      line: el.getElementsByTagName('polyline')[0] || null,
      fill: el.getElementsByTagName('polygon')[0] || null,
      thrLine: (function (node) { // 磁盘等图标内也有 <line>,按 class 精确取阈值线
        var ls = node.getElementsByTagName('line'), j;
        for (j = 0; j < ls.length; j++) if (ls[j].getAttribute('class') === 'thr') return ls[j];
        return null;
      })(el),
      bar: null
    };
    hist[hero.key] = (hero.history && hero.history.length) ? hero.history : [];

    // 行引用(按序对位)
    var blocks = el.getElementsByTagName('div'), rowEls = [], m;
    for (m = 0; m < blocks.length; m++) if (blocks[m].className === 'srow2') rowEls.push(blocks[m]);
    for (k = 0; k < rowEls.length && k < rowItems.length; k++) {
      var item = rowItems[k], rEl = rowEls[k];
      cells[item.key] = {
        hero: false, panel: el, block: rEl,
        v: rEl.getElementsByTagName('span')[0], unit: item.unit,
        raw: item.raw, type: item.type, thr: thrOf(item.raw, item.type),
        line: null, fill: null, thrLine: null,
        bar: rEl.getElementsByTagName('b')[0] || null
      };
    }

    // 线程条引用(增量帧按线程负载键推进:CPU Core #N / Core #N)
    if (coreCount) {
      var coresEl = null, divs = el.getElementsByTagName('div');
      for (k = 0; k < divs.length; k++) if (divs[k].className === 'cores') { coresEl = divs[k]; break; }
      if (coresEl) coreRefs.push({ bars: coresEl.getElementsByTagName('b'), panel: i });
    }
  }

  if (!used)
    panelsEl.innerHTML = '<div class="empty">未选择任何传感器<br><a href="/settings.html">前往设置页选择</a></div>';

  // 全量帧数据一并灌入
  for (i = 0; i < rows.length; i++) setVal(rows[i]);
  updateCores(rows);
}

/* ---------- 单项更新(所有异常吞掉,只影响该项) ---------- */
function setVal(r) {
  try {
    var key = r.hardware + '|' + r.sensor + '|' + r.type;
    var c = cells[key];
    if (!c) return;
    var has = r.value !== null && r.value !== undefined;
    c.v.textContent = has ? fmt(r.value, c.unit || r.unit, c.raw) : '—';
    var state = '';
    if (c.thr && has) {
      if (r.value >= c.thr) state = 'hot';
      else if (r.value >= c.thr * 0.9) state = 'warm';
    }
    c.block.className = c.block.className.replace(/ *warm| *hot/g, '') + (state ? ' ' + state : '');
    if (c.hero) c.panel.className = 'panel' + (state === 'hot' ? ' hot' : '');
    if (c.bar) {
      var x = has ? Math.max(0, Math.min(100, r.value)) / 100 : 0;
      c.bar.style.webkitTransform = 'scaleX(' + x.toFixed(3) + ')';
      c.bar.style.transform = 'scaleX(' + x.toFixed(3) + ')';
    }
    if (c.hero && c.line && has) {
      if (r.history && r.history.length) hist[key] = r.history;
      else {
        if (!hist[key]) hist[key] = [];
        hist[key].push(r.value);
        if (hist[key].length > HIST_LEN) hist[key].shift();
      }
      var h = hist[key];
      if (h && h.length > 1) {
        var pt = points(h, c.thr || null);
        c.line.setAttribute('points', pt.line);
        if (c.fill) c.fill.setAttribute('points', '0,16 ' + pt.line + ' 100,16');
        if (c.thrLine) {
          if (pt.thrY !== null) {
            c.thrLine.setAttribute('y1', pt.thrY); c.thrLine.setAttribute('y2', pt.thrY);
            c.thrLine.setAttribute('opacity', '1');
          } else c.thrLine.setAttribute('opacity', '0');
        }
      }
    }
  } catch (e) { /* 单项失败:保持「—」 */ }
}

/* ---------- 线程条:同面板线程负载键按序映射到微条 ---------- */
function updateCores(rows) {
  try {
    var i, k;
    for (i = 0; i < coreRefs.length; i++) {
      var ref = coreRefs[i], n = ref.bars.length;
      var vals = [];
      for (k = 0; k < rows.length; k++) {
        var r = rows[k];
        if (r.type !== 'Load') continue;
        if (!(/^CPU Core #\d+$/.test(r.sensor) || /^Core #\d+$/.test(r.sensor))) continue;
        var pi = panelOfKey(r.hardware + '|' + r.sensor + '|' + r.type, r.hardware, r.sensor);
        if (pi !== ref.panel) continue;
        var idx = parseInt(r.sensor.replace(/[^0-9]/g, ''), 10) || (vals.length + 1);
        vals[idx - 1] = r.value;
      }
      for (k = 0; k < n && k < vals.length; k++) {
        var v = vals[k];
        var y = (v === null || v === undefined) ? 0 : Math.max(0, Math.min(100, v)) / 100;
        ref.bars[k].style.webkitTransform = 'scaleY(' + y.toFixed(3) + ')';
        ref.bars[k].style.transform = 'scaleY(' + y.toFixed(3) + ')';
      }
    }
  } catch (e) { /* 线程条失败不影响数值 */ }
}

/* ---------- 增量帧:只更新已有单元;缺失键回退「—」 ---------- */
function applyUpdate(rows) {
  var seen = {}, i, key;
  for (i = 0; i < rows.length; i++) {
    var r = rows[i];
    key = r.hardware + '|' + r.sensor + '|' + r.type;
    seen[key] = true;
    setVal(r);
  }
  for (key in cells)
    if (cells.hasOwnProperty(key) && !seen[key]) {
      try {
        cells[key].v.textContent = '—';
        if (cells[key].bar) {
          cells[key].bar.style.webkitTransform = 'scaleX(0)';
          cells[key].bar.style.transform = 'scaleX(0)';
        }
      } catch (e) { /* 忽略单项 */ }
    }
  updateCores(rows);
}

/* ---------- 启动:SSE 全量首帧 + 每秒增量 + notify/alarm 事件 ---------- */
function getJson(url, cb) {
  var x = new XMLHttpRequest();
  x.open('GET', url, true);
  x.onreadystatechange = function () {
    if (x.readyState === 4) {
      var data = null;
      if (x.status === 200) { try { data = JSON.parse(x.responseText); } catch (e) { data = null; } }
      cb(data);
    }
  };
  x.send(null);
}

function init() {
  panelsEl = document.getElementById('panels');
  getJson('/api/config', function (c) {
    cfg = c || { visible: [], alarms: [] };
    if (!cfg.visible) cfg.visible = [];
    if (!cfg.alarms) cfg.alarms = [];
    // 设备目录(面板归属权威源);失败/旧 exe 404 → 保持 null,回退名字正则
    getJson('/api/hwinfo', function (h) {
      hwinfo = h || null;
      startStream();
    });
  });
}

/* ---------- 线缆拔插(SMIL):数据流在线=插上,断线=拔开;初始拔开,首帧插上 ---------- */
var plugged = false;
function firePlug(dir) {
  var ids = dir === 'out' ? ['aLout', 'aRout', 'aTLout', 'aTRout']
                          : ['aLin', 'aRin', 'aTLin', 'aTRin'];
  for (var i = 0; i < ids.length; i++) {
    try {
      var a = document.getElementById(ids[i]);
      if (a && a.beginElement) a.beginElement();
    } catch (e) { /* SMIL 不可用:静态姿态,不影响数据 */ }
  }
}
function plugIn() { if (plugged) return; plugged = true; firePlug('in'); }
function plugOut() { if (!plugged) return; plugged = false; firePlug('out'); }

function startStream() {
  var es = new EventSource('/api/stream');
  es.onmessage = function (e) {
    var rows;
    try { rows = JSON.parse(e.data); } catch (err) { return; }
    if (!rows) return;
    try {
      if (!booted) { fullRender(rows); booted = true; }
      else applyUpdate(rows);
    } catch (err2) { /* 渲染异常:下一帧重试 */ }
    plugIn();
    var now = new Date();
    document.getElementById('clock').textContent =
      p2(now.getHours()) + ':' + p2(now.getMinutes()) + ':' + p2(now.getSeconds());
    document.getElementById('live').className = 'dot';
  };
  es.onerror = function () {
    plugOut();
    document.getElementById('clock').textContent = '重连中…';
    document.getElementById('live').className = 'dot off';
  };
  initNotifications(es);
}
init();

// 无 CSS Grid 的旧 WebView → flex 回退
(function () {
  var ok = false;
  try { ok = !!(window.CSS && CSS.supports && CSS.supports('display', 'grid')); } catch (e) { ok = false; }
  if (!ok) document.documentElement.className += ' no-grid';
})();

// 常驻显示屏适配:点按全屏(含旧 WebView 前缀)+ 屏幕保亮(notify.js 共享)
document.addEventListener('click', function (e) {
  var t = e.target;
  while (t && t.id !== 'gear' && t.id !== 'photos' && t !== document.body) t = t.parentNode;
  if (t && (t.id === 'gear' || t.id === 'photos')) return; // 点图标去对应页,不触发全屏
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  var el = document.documentElement;
  if (el.requestFullscreen) {
    var p = el.requestFullscreen();
    if (p && p.catch) p.catch(function () {});
  } else if (el.webkitRequestFullscreen) {
    try { el.webkitRequestFullscreen(); } catch (e2) { /* 忽略 */ }
  }
});
keepScreenOn();
document.addEventListener('visibilitychange', function () { if (!document.hidden) keepScreenOn(); });
document.addEventListener('fullscreenchange', function () { keepScreenOn(); });
document.addEventListener('webkitfullscreenchange', function () { keepScreenOn(); });
</script>
